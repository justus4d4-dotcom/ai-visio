; PlatformIO project for the AI Image Interpreter ESP32 display.
;
; Target board: Waveshare ESP32-S3-Touch-LCD-1.28
;   - 1.28" round LCD, GC9A01 driver (SPI)
;   - CST816S capacitive touch (I2C)
;   - ESP32-S3R2 (16MB flash, 2MB PSRAM)
;
; The whole screen is one button: a touch sends /api/remote/trigger to the backend,
; the browser solves the current frame, and the device polls /api/remote/answer to
; show the result. WiFi + server URL are provisioned via an on-device captive portal.

[platformio]
default_envs = waveshare-s3-round

[env:waveshare-s3-round]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    bblanchon/ArduinoJson@^7.2.0
    links2004/WebSockets@^2.6.1
    https://github.com/tzapu/WiFiManager.git#v2.0.17

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_SKIP
    ; Display geometry (round 240x240)
    -DSCREEN_WIDTH=240
    -DSCREEN_HEIGHT=240
    ; OTA update identity (change the password before deploying!)
    -DOTA_HOSTNAME=\"ai-image-display\"
    -DOTA_PASSWORD=\"change-this-ota-pass\"

; ---------------------------------------------------------------------------
; Over-the-air (OTA) upload over WiFi. Use after the device has been flashed
; once over USB. Find the device IP on its idle screen, then either set it
; below or pass it on the command line:
;   pio run -e waveshare-s3-round-ota -t upload --upload-port <device-ip>
; In VS Code: select the "waveshare-s3-round-ota" env, then Upload.
; The --auth value MUST match OTA_PASSWORD above.
; ---------------------------------------------------------------------------
[env:waveshare-s3-round-ota]
extends = env:waveshare-s3-round
upload_protocol = espota
upload_port = 192.0.2.10
upload_flags =
    --auth=change-this-ota-pass
